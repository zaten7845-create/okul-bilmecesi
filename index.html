<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Yakışıklı Sayfam</title>
    <style>
        /* CSS Kodlarımız Buraya Geliyor */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24; /* Koyu modern arka plan */
            color: #fff; /* Beyaz yazı rengi */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .kart {
            background-color: #2a2a35; /* Kartın arka planı */
            padding: 30px;
            border-radius: 15px; /* Köşeleri yuvarlama */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); /* Hafif gölge */
            text-align: center;
            max-width: 400px;
            border: 2px solid #ff4a5a; /* Canlı bir detay çizgisi */
        }

        h1 {
            color: #ff4a5a; /* Başlık rengi */
            margin-top: 0;
        }

        p {
            color: #b3b3cc; /* Yardımcı yazı rengi */
            line-height: 1.6;
        }

        .buton {
            display: inline-block;
            background-color: #ff4a5a;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s ease; /* Geçiş efekti */
        }

        .buton:hover {
            background-color: #e03e4d; /* Fareyle üzerine gelince renk değişimi */
        }
    </style>
</head>
<body>

    <div class="kart">
