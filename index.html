<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İzmit Lisesi - T.C. Millî Eğitim Bakanlığı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; color: #333; line-height: 1.6; }
        
        header {
            background: linear-gradient(to right, #003087, #0066cc);
            color: white;
            padding: 15px 0;
        }
        .header-content {
            max-width: 1250px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .logo {
            height: 90px;
            width: auto;
        }
        .okul-bilgi {
            text-align: center;
        }
        .meb { font-size: 18px; font-weight: bold; }
        .okul-adi { font-size: 32px; margin: 8px 0; font-weight: bold; }

        nav {
            background: #002d5a;
            padding: 16px 0;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 28px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 17px;
        }
        nav a:hover { color: #ffd700; }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://via.placeholder.com/1920x650?text=%C4%B0zmit+Lisesi') center/cover no-repeat;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .hero h1 { font-size: 52px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        .container { max-width: 1250px; margin: 0 auto; padding: 30px 20px; }

        .section { margin: 55px 0; }
        h2 { 
            color: #003087; 
            border-bottom: 4px solid #0066cc; 
            padding-bottom: 12px;
            margin-bottom: 30px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .card:hover { transform: translateY(-10px); transition: 0.4s; }
        .card img { width: 100%; height: 210px; object-fit: cover; }

        footer {
            background: #002d5a;
            color: white;
            text-align: center;
            padding: 45px 20px;
            margin-top: 70px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <img src="https://via.placeholder.com/120x120?text=LOGO" alt="İzmit Lisesi Logo" class="logo">
            <div class="okul-bilgi">
