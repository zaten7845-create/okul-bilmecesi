<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Okul Bilmecesi - İzmit Lisesi Mobil</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
    }
    
    body {
      -webkit-tap-highlight-color: transparent; /* Mobil cihazlarda tıklama anındaki mavi gölgeyi kaldırır */
      background-color: #121212;
    }

    .bg {
      background-image: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxITEhUSEhIWFRUXFxUaFhUYFhUYFRUXFRcXFxgVFRYYHiggGBolGxcXITEhJSkrLi4uFyAzODMtNygtLisBCgoKDg0OGxAQGi8fHyUtLS0tLS0tLS0tLS0uLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLf/AABEIALcBEwMBIgACEQEDEQH/xAAbAAABBQEBAAAAAAAAAAAAAAACAAEDBAUGB//EAE0QAAIBAgQCBgYFCQcCAwkAAAECEQADBBIhMQVBBhMiUWFxMoGRobHRFCNCcsEkM1JigpKywvAVQ1NzorPhY5Oj4vEWNDVEVIO0w9L/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAKREAAgIBBAMAAQQCAw...');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .overlay {
      background: rgba(0,0,0,0.72);
      min-height: 100vh;
      padding: 12px;
    }

    .container { 
      max-width: 540px; 
      margin: 0 auto; 
    }
    
    /* Skor ve Başlık Alanı */
    .header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 12px; 
      gap: 8px; 
    }

    .title { 
      font-size: 18px; 
      font-weight: 700; 
      color: #fff; 
    }
    
    .score-box { 
      display: flex; 
      gap: 6px; 
    }

    .score-item { 
      background: rgba(255,255,255,0.12); 
      border-radius: 8px; 
      padding: 4px 10px; 
      text-align: center; 
      border: 1px solid rgba(255,255,255,0.2); 
    }

    .score-label { 
      font-size: 10px; 
      color: rgba(255,255,255,0.6); 
    }

    .score-value { 
      font-size: 15px; 
      font-weight: 600; 
      color: #fff; 
    }

    /* Görsel Paneli */
    .school-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .school-img {
      width: 100%;
      height: 135px;
      object-fit: cover;
      display: block;
    }

    .school-info {
      padding: 8px;
      color: #fff;
      background: rgba(0,0,0,0.4);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* Mobilde Sağa Kaydırılabilir Yatay Kategori Menüsü */
    .category-bar { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      margin-bottom: 12px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; /* iOS için akıcı kaydırma */
      scrollbar-width: none; /* Firefox için kaydırma çubuğunu gizler */
    }

    .category-bar::-webkit-scrollbar { 
      display: none; /* Chrome ve Safari için kaydırma çubuğunu gizler */
    }
    
    .cat-btn { 
      padding: 8px 14px; 
      border-radius: 20px; 
      border: 1px solid rgba(255,255,255,0.25); 
      background: rgba(255,255,255,0.1); 
      color: rgba(255,255,255,0.9); 
      font-size: 13px; 
      cursor: pointer; 
      white-space: nowrap; 
      transition: all 0.2s;
    }

    .cat-btn.active { 
      background: rgba(127,119,221,0.85); 
      border-color: #AFA9EC; 
      color: #fff; 
      font-weight: 600; 
    }

    /* İlerleme Çubuğu */
    .progress-bar { 
      height: 5px; 
      background: rgba(255,255,255,0.15); 
      border-radius: 3px; 
      margin-bottom: 12px; 
      overflow: hidden; 
    }

    .progress-fill { 
      height: 100%; 
      background: #AFA9EC; 
      border-radius: 3px; 
      transition: width 0.3s ease; 
    }
    
    /* Soru Kartı Yapısı */
    .question-card { 
      background: rgba(255,255,255,0.12); 
      border: 1px solid rgba(255,255,255,0.2); 
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 12px; 
    }

    .q-meta { 
      font-size: 11px; 
      color: rgba(255,255,255,0.5); 
      margin-bottom: 6px; 
    }

    .q-text { 
      font-size: 16px; 
      font-weight: 500; 
      color: #fff; 
      line-height: 1.5; 
      margin-bottom: 16px; 
    }
    
    /* Dokunmatik Ekranlar için Büyük Butonlu Şıklar */
    .options { 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }

    .opt-btn { 
      width: 100%;
      padding: 14px; 
      border-radius: 10px; 
      border: 1px solid rgba(255,255,255,0.25); 
      background: rgba(255,255,255,0.08); 
      color: #fff; 
      font-size: 14px; 
      cursor: pointer; 
      text-align: left; 
      transition: background 0.15s ease; 
    }

    .opt-btn:hover:not(:disabled) { 
      background: rgba(255,255,255,0.15); 
    }

    .opt-btn.correct { 
      background: rgba(99,153,34,0.8); 
      border-color: #97C459; 
      color: #fff; 
    }

    .opt-btn.wrong { 
      background: rgba(226,75,74,0.8); 
      border-color: #F09595; 
      color: #fff; 
    }
    
    /* Bilgi ve Geri Bildirim Kutusu */
    .feedback { 
      margin-top: 12px; 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 14px; 
      line-height: 1.5; 
    }

    .feedback.correct { 
      background: rgba(99,153,34,0.35); 
      color: #d4ffaa; 
      border: 1px solid #97C459; 
    }

    .feedback.wrong { 
      background: rgba(226,75,74,0.35); 
      color: #ffd0d0; 
      border: 1px solid #F09595; 
    }
    
    /* İleri / Tekrar Butonları */
    .next-btn { 
      width: 100%; 
      margin-top: 4px; 
      padding: 14px; 
      border-radius: 10px; 
      border: 1px solid rgba(255,255,255,0.3); 
      background: rgba(255,255,255,0.15); 
      color: #fff; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer; 
    }
    
    /* Sonuç Ekranı */
    .result-card { 
      text-align: center; 
      padding: 32px 16px; 
      background: rgba(255,255,255,0.12); 
      border: 1px solid rgba(255,255,255,0.2); 
      border-radius: 12px; 
    }

    .result-emoji { 
      font-size: 48px; 
      margin-bottom: 8px; 
    }

    .result-score { 
      font-size: 30px; 
      font-weight: 700; 
      color: #fff; 
      margin-bottom: 6px; 
    }

    .result-label { 
      font-size: 14px; 
      color: rgba(255,255,255,0.8); 
      margin-bottom: 20px; 
    }
  </style>
</head>

// Karıştırma Algoritması
function shuffle(arr) {
  let newArr = [...arr];
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
  }
  return newArr;
}

// Karışık Havuzunu İnşa Etme
function buildKarisik() {
  let allQuestions = [];
  ['tarih','cografya','fen','matematik','turkce','yapayzeka'].forEach(c => {
    allQuestions = allQuestions.concat(DB[c]);
  });
  DB.karisik = shuffle(allQuestions).slice(0, 10);
}
buildKarisik();

let cat = 'tarih';
let pool = shuffle([...DB.tarih]);
let idx = 0, correct = 0, wrong = 0, total = 0, answered = false;

// Kategori Seçim Fonksiyonu
function selectCat(c, btn) {
  cat = c;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  correct = 0; wrong = 0; total = 0;
  ['sc','sw','sq'].forEach(id => document.getElementById(id).textContent = 0);
  document.getElementById('pgr').style.width = '0%';
  
  if (c === 'karisik') {
    buildKarisik();
    pool = DB.karisik;
  } else {
    pool = shuffle([...DB[c]]);
  }
  idx = 0; 
  showQ();
}

// Soru Gösterme Yapısı
function showQ() {
  answered = false;
  if (idx >= pool.length) { showResult(); return; }
  const q = pool[idx]; 
  total++;
  
  document.getElementById('sq').textContent = total;
  document.getElementById('pgr').style.width = Math.round((idx / pool.length) * 100) + '%';
  
  // Şık havuzunu ve buton atamalarını karıştırır
  let randomizedOptions = q.o.map((opt, i) => ({ text: opt, key: ['A','B','C','D'][i] }));
  randomizedOptions = shuffle(randomizedOptions);

  document.getElementById('game').innerHTML = `
    <div class="question-card">
      <div class="q-meta">Soru ${total} / ${pool.length}</div>
      <div class="q-text">${q.s}</div>
      <div class="options">
        ${randomizedOptions.map((opt) => {
          return `<button class="opt-btn" id="o${opt.key}" onclick="pick('${opt.key}')">${opt.text}</button>`;
        }).join('')}
      </div>
      <div id="fb"></div>
    </div>
    <button class="next-btn" id="nb" style="display:none" onclick="next()">Sonraki Soru →</button>
  `;
}

// Tıklama Algılama
function pick(l) {
  if (answered) return; 
  answered = true;
  const q = pool[idx];
  const ok = l === q.d;
  
  if (ok) { 
    correct++; 
    document.getElementById('sc').textContent = correct; 
  } else { 
    wrong++; 
    document.getElementById('sw').textContent = wrong; 
  }
  
  ['A','B','C','D'].forEach(x => {
    const b = document.getElementById('o' + x); 
    if (!b) return;
    b.disabled = true;
    if (x === q.d) b.classList.add('correct');
    else if (x === l) b.classList.add('wrong');
  });
  
  const dogru = q.o[['A','B','C','D'].indexOf(q.d)];
  document.getElementById('fb').innerHTML = `
    <div class="feedback ${ok ? 'correct' : 'wrong'}">
      ${ok ? '✅ Doğru!' : '❌ Yanlış! Doğru Cevap: ' + dogru}<br>
      <span style="font-size:13px; opacity:0.95; display:block; margin-top:4px;">${q.a}</span>
    </div>`;
  document.getElementById('nb').style.display = 'block';
}

function next() { 
  idx++; 
  showQ(); 
}

// Sonuç Ekranı
function showResult() {
  const pct = Math.round((correct / pool.length) * 100);
  const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '👏' : pct >= 40 ? '📚' : '💪';
  const msg = pct >= 80 ? 'Harika!' : pct >= 60 ? 'İyi iş!' : pct >= 40 ? 'Biraz daha çalış!' : 'Daha fazla pratik yap!';
  
  document.getElementById('pgr').style.width = '100%';
  document.getElementById('game').innerHTML = `
    <div class="result-card">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${correct} / ${pool.length}</div>
      <div class="result-label">${msg}<br>Başarı Oranın: %${pct}</div>
      <button class="next-btn" style="max-width:220px; margin:0 auto; display:block;" onclick="restart()">Tekrar Oyna</button>
    </div>`;
}

function restart() {
  correct = 0; wrong = 0; total = 0;
  ['sc','sw','sq'].forEach(id => document.getElementById(id).textContent = 0);
  document.getElementById('pgr').style.width = '0%';
  if (cat === 'karisik') buildKarisik();
  pool = shuffle([...DB[cat]]); 
  idx = 0; 
  showQ();
}

// İlk Çalıştırma
showQ();
</script>
</body>
